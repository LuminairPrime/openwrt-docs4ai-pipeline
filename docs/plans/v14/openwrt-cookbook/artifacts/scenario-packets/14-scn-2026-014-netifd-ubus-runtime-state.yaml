scenario:
  scenario_id: "SCN-2026-014"
  short_name: "netifd-ubus-runtime-state"
  title: "network.interface dump runtime state shape"
  category: "ubus_netifd_runtime_state"
  openwrt_boundary: "extracting live IPv4 data from the network.interface dump ubus response"
  programming_family: "LuCI/runtime ubus state"

inspiration:
  primary_kind: "upstream_pattern"
  allowed_kinds:
    - blind_failure
    - cookbook_gap
    - upstream_pattern
    - archive_confusion
    - skill_need
  summary: >-
    Local LuCI code reads network.interface dump by treating ipv4-address as an array of objects, a detail generic AI answers frequently flatten or invent incorrectly.
  primary_source:
    source_type: "upstream_code"
    path_or_url: "tmp/smoke-test-kujhbse0/staged/release-tree/luci-examples/chunked-reference/example_app-luci-app-dockerman-htdocs-luci-static-resources-dockerman-api-js.md"
    locator: "callNetworkInterfaceDump declaration and ipv4-address access"

authority:
  summary: >-
    Correct LuCI-side runtime extraction uses network.interface.dump with expect { interface: [] } and walks ipv4-address as an array of objects exposing address fields.
  primary_source:
    source_type: "upstream_code"
    path_or_url: "tmp/smoke-test-kujhbse0/staged/release-tree/luci-examples/chunked-reference/example_app-luci-app-dockerman-htdocs-luci-static-resources-dockerman-api-js.md"
    locator: "network.interface dump response handling"
  supporting_sources:
    - source_type: "repo_doc"
      path_or_url: "docs/plans/v14/openwrt-cookbook/tmp/cookbook-test-coverage-gap-analysis.md"
      locator: "candidate 3.1 verification summary"
  why_authoritative: >-
    The production LuCI example shows the exact runtime shape and extraction pattern for live netifd interface data.

blind_prompt:
  prompt_text: |
    Write a LuCI/OpenWrt JS snippet that calls the runtime network-interface dump over ubus and extracts the first non-loopback IPv4 address for the `lan` interface from the returned data structure.
  prompt_notes:
    - "Do not turn this into a full view file."
    - "The key boundary is the structure of the dump response."

scoring:
  expected_paradigms:
    - "rpc.declare"
    - "object: 'network.interface'"
    - "method: 'dump'"
    - "expect: { 'interface': [] }"
    - "iface['ipv4-address']"
    - "a.address"
  explicit_falsenesses:
    - "flat ipv4 string"
    - "wrong ubus object"
    - "wrong method"
  binary_pass_rule: "all required paradigms present and no falseness triggered"

