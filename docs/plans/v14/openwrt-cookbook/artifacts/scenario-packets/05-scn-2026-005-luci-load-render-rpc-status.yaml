instructions:
  purpose: >-
    Filled admission packet for the LuCI JS async load-versus-render boundary.
  required_rule: >-
    Keep the scenario narrowly about rpc.declare plus load()/render() lifecycle separation,
    not generic LuCI form construction.

scenario:
  scenario_id: "SCN-2026-005"
  short_name: "luci-load-render-rpc-status"
  title: "LuCI JS async load/render status form lifecycle"
  category: "luci_js_async_status"
  openwrt_boundary: "rpc.declare plus load() data fetch with render() consuming resolved values"
  programming_family: "LuCI frontend architecture"

inspiration:
  primary_kind: "upstream_pattern"
  allowed_kinds:
    - blind_failure
    - cookbook_gap
    - upstream_pattern
    - archive_confusion
    - skill_need
  summary: >-
    Local LuCI views show a repeatable pattern where live rpc data and UCI state are fetched
    in load() and only consumed in render(), a boundary generic frontend answers often flatten.
  primary_source:
    source_type: "upstream_code"
    path_or_url: "tmp/authoring-repos/repo-luci-full/applications/luci-app-dcwapd/htdocs/luci-static/resources/view/dcwapd/dcwapd.js"
    locator: "rpc.declare plus load() Promise.all() and render() form.Map lifecycle"

authority:
  summary: >-
    Current LuCI JS views use rpc.declare and Promise-based load() to obtain data before render().
  primary_source:
    source_type: "upstream_code"
    path_or_url: "tmp/authoring-repos/repo-luci-full/applications/luci-app-dcwapd/htdocs/luci-static/resources/view/dcwapd/dcwapd.js"
    locator: "callLuciWirelessDevices, load(), render([wireless_devices])"
  why_authoritative: >-
    This is a current local upstream LuCI JS view using the exact modern lifecycle the scenario tests.

blind_prompt:
  prompt_text: |
    Write a modern OpenWrt LuCI JS view snippet that loads live status data from ubus with rpc.declare() during load(), also loads its UCI config, and then renders a form.Map page from that resolved data. Do not fetch RPC data directly inside render().
  prompt_notes:
    - "Keep the task about lifecycle separation, not specific widgets."
    - "Do not mention Promise.all explicitly in the prompt."

scoring:
  expected_paradigms:
    - "rpc.declare"
    - "load()"
    - "Promise.all or equivalent async pre-render fetch"
    - "form.Map"
  explicit_falsenesses:
    - "fetch() or XMLHttpRequest"
    - "live RPC call issued directly inside render()"
    - "legacy Lua CBI"
  binary_pass_rule: "all required paradigms present and no falseness triggered"

