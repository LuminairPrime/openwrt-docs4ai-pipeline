template_version: 1
template_status: candidate-packet
instructions:
  purpose: >-
    Filled admission packet for the rpcd ACL silent-failure boundary used by LuCI rpc.declare flows.
  required_rule: >-
    Keep the scenario about the ACL contract and install path, not broader LuCI form authoring.

scenario:
  scenario_id: "SCN-2026-011"
  short_name: "rpcd-acl-silent-failure"
  title: "rpcd ACL JSON contract for LuCI RPC permission"
  category: "rpcd_acl_contract"
  openwrt_boundary: "rpcd ACL JSON file and install path required for browser-session ubus access"
  programming_family: "LuCI/rpcd permissions"

inspiration:
  primary_kind: "upstream_pattern"
  allowed_kinds:
    - blind_failure
    - cookbook_gap
    - upstream_pattern
    - archive_confusion
    - skill_need
  summary: >-
    Local LuCI example code explicitly warns that a declared RPC call is blocked by the framework until the corresponding ACL is granted in /usr/share/rpcd/acl.d.
  primary_source:
    source_type: "upstream_code"
    path_or_url: "tmp/smoke-test-kujhbse0/staged/release-tree/luci-examples/chunked-reference/example_app-luci-app-example-htdocs-luci-static-resources-view-example-rpc-js.md"
    locator: "permissions comment and blocked-call note near load_sample3"

authority:
  summary: >-
    Correct LuCI-session access to rpcd methods requires a package-installed ACL JSON file under /usr/share/rpcd/acl.d with explicit read/write ubus method grants.
  primary_source:
    source_type: "repo_doc"
    path_or_url: "tmp/smoke-test-kujhbse0/staged/release-tree/cookbook/chunked-reference/architecture-overview.md"
    locator: "ACL file format and /usr/share/rpcd/acl.d/<plugin>.json guidance"
  supporting_sources:
    - source_type: "upstream_code"
      path_or_url: "tmp/smoke-test-kujhbse0/staged/release-tree/luci-examples/chunked-reference/example_app-luci-app-example-htdocs-luci-static-resources-view-example-rpc-js.md"
      locator: "framework-blocked RPC call due to missing ACL"
    - source_type: "repo_doc"
      path_or_url: "openwrt-condensed-docs-renamed/support-tree/semantic-pages/cookbook/luci-form-with-uci.md"
      locator: "ACL JSON example and install path"
  why_authoritative: >-
    The combined cookbook and example-app sources define both the required JSON structure and the real silent-failure behavior when the ACL is missing.

blind_prompt:
  prompt_text: |
    Your LuCI JS view already uses `rpc.declare()` to call ubus methods on `myservice`, but the framework blocks the call because permission is missing. Write the rpcd ACL JSON file needed to grant the LuCI session read access to `get_config` and write access to `set_config`, and say where the file must be installed.
  prompt_notes:
    - "Do not turn this into a LuCI form implementation task."
    - "The boundary is ACL JSON plus install path."

scoring:
  expected_paradigms:
    - "/usr/share/rpcd/acl.d/<plugin>.json"
    - "read"
    - "write"
    - "ubus"
    - "myservice"
  explicit_falsenesses:
    - "frontend-only permission grant"
    - "UCI ACL instead of rpcd ubus ACL"
    - "omits install path"
  binary_pass_rule: "all required paradigms present and no falseness triggered"

family_assignment:
  family_id: "FAM-RPCD-ACL"
  family_decision:
    existing_family_match: true
    reason: "This packet isolates the rpcd ACL silent-failure contract as its own documentation family."

coverage_check:
  existing_pages_considered:
    - "static/cookbook-source/luci-form-with-uci.md"
    - "static/cookbook-source/architecture-overview.md"
  already_adequately_covered: false
  coverage_rationale: >-
    The corpus mentions ACLs, but the exact silent-failure boundary is still diffuse rather than surfaced as a targeted lesson.
  preferred_outcome_if_fail:
    allowed_values:
      - reject
      - golden-key-only
      - extend-existing-page
      - new-standalone-page
      - umbrella-page
    value: "extend-existing-page"
  target_pages:
    - "static/cookbook-source/luci-form-with-uci.md"
    - "static/cookbook-source/architecture-overview.md"

queue:
  initial_status:
    allowed_values:
      - candidate
      - active-discovery
      - verification
      - benchmark-only
      - retired
    value: "candidate"
  intended_mode:
    allowed_values:
      - discovery
      - verification
      - benchmark
    value: "discovery"

delivery:
  grouped_batch_policy:
    one_per_domain_category_type: true
    candidate_group_ids:
      - "theta"
    do_not_batch_with_scenarios:
      - "23"
    do_not_batch_with_categories:
      - "makefile_package_install_layout"
      - "luci_js_async_status"
    rationale: "Keep ACL JSON separate from the adjacent install-layout and LuCI lifecycle lessons."

operator_record:
  proposed_by: "GitHub Copilot"
  date_opened: "2026-04-05"
  approval_status:
    allowed_values:
      - proposed
      - admitted
      - rejected
    value: "admitted"
  notes: "Admitted as the highest-confidence ACL silent-failure packet using example-app and cookbook authority."