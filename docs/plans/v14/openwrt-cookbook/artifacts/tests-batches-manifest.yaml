# This manifest is the machine-readable batch contract.
# It records batch membership, file pairings, scenario membership, and grouping rationale.
# The shared batch execution header is governed separately by
# artifacts/templates/00-batch-prompt-header-template.md.
# If a batch is remapped or refreshed, update this manifest first and then refresh the
# batch prompt header from that template rather than rewriting the shared contract in this
# manifest.

