template_version: 1
template_status: candidate-packet
instructions:
  purpose: >-
    Filled admission packet for the OpenWrt package install runtime-layout boundary.
  required_rule: >-
    Keep the scenario about Package/install asset placement, not full package build boilerplate.

scenario:
  scenario_id: "SCN-2026-010"
  short_name: "package-install-luci-rpcd-bootstrap"
  title: "Package install layout for LuCI, rpcd, config, ACL, and defaults"
  category: "makefile_package_install_layout"
  openwrt_boundary: "runtime install layout inside OpenWrt Package/install"
  programming_family: "Buildroot packaging"

inspiration:
  primary_kind: "upstream_pattern"
  allowed_kinds:
    - blind_failure
    - cookbook_gap
    - upstream_pattern
    - archive_confusion
    - skill_need
  summary: >-
    Local OpenWrt and LuCI package Makefiles expose concrete install destinations for rpcd helpers, ACL files, config, and uci-defaults; models often know compile boilerplate but miss these runtime ownership paths.
  primary_source:
    source_type: "upstream_code"
    path_or_url: "tmp/authoring-repos/repo-openwrt-full/package/network/services/dnsmasq/Makefile"
    locator: "Package/dnsmasq/install asset placement"

authority:
  summary: >-
    Runtime package install layout in OpenWrt is defined by explicit Package/install sections and concrete filesystem destinations.
  primary_source:
    source_type: "upstream_code"
    path_or_url: "tmp/authoring-repos/repo-openwrt-full/package/network/services/dnsmasq/Makefile"
    locator: "etc/config, usr/share/acl.d, etc/uci-defaults install paths"
  supporting_sources:
    - source_type: "upstream_code"
      path_or_url: "tmp/authoring-repos/repo-luci-full/libs/rpcd-mod-rad3-enc/Makefile"
      locator: "usr/libexec/rpcd install path"
  why_authoritative: >-
    These local upstream Makefiles provide the concrete runtime install locations the scenario tests.

blind_prompt:
  prompt_text: |
    Write the OpenWrt Package/install snippet for a package that needs to ship a LuCI JS view, an ACL file, an rpcd helper, a /etc/config/ file, and a /etc/uci-defaults/ bootstrap script.
  prompt_notes:
    - "Do not turn this into a full package Makefile with compile boilerplate."
    - "The task is runtime install layout only."

scoring:
  expected_paradigms:
    - "define Package/.../install"
    - "$(INSTALL_DIR)"
    - "$(INSTALL_BIN)"
    - "$(INSTALL_CONF) or $(INSTALL_DATA)"
    - "paths for /etc/config, /etc/uci-defaults, ACL, and rpcd helper"
  explicit_falsenesses:
    - "compile-only Makefile boilerplate"
    - "generic Linux install commands outside the OpenWrt package DSL"
  binary_pass_rule: "all required paradigms present and no falseness triggered"

family_assignment:
  family_id: "FAM-BUILDROOT"
  family_decision:
    existing_family_match: true
    reason: "This packet extends buildroot knowledge from compile boilerplate into runtime asset placement."

coverage_check:
  existing_pages_considered:
    - "static/cookbook-source/minimal-openwrt-package-makefile.md"
    - "static/cookbook-source/package-config-bootstrap-pattern.md"
  already_adequately_covered: false
  coverage_rationale: >-
    Existing pages are adjacent, but this packet isolates the multi-asset runtime install contract models often miss.
  preferred_outcome_if_fail:
    allowed_values:
      - reject
      - golden-key-only
      - extend-existing-page
      - new-standalone-page
      - umbrella-page
    value: "extend-existing-page"
  target_pages:
    - "static/cookbook-source/minimal-openwrt-package-makefile.md"
    - "static/cookbook-source/package-config-bootstrap-pattern.md"

queue:
  initial_status:
    allowed_values:
      - candidate
      - active-discovery
      - verification
      - benchmark-only
      - retired
    value: "candidate"
  intended_mode:
    allowed_values:
      - discovery
      - verification
      - benchmark
    value: "discovery"

delivery:
  grouped_batch_policy:
    one_per_domain_category_type: true
    candidate_group_ids:
      - "theta"
    do_not_batch_with_scenarios:
      - "11"
    do_not_batch_with_categories:
      - "makefile_build_system"
    rationale: "Keep runtime install layout separate from the compile-only package Makefile question."

operator_record:
  proposed_by: "GitHub Copilot"
  date_opened: "2026-04-05"
  approval_status:
    allowed_values:
      - proposed
      - admitted
      - rejected
    value: "admitted"
  notes: "Admitted as a net-new buildroot runtime-layout scenario using local Makefile install patterns."
