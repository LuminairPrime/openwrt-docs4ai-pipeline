      locator: "P0 uci_load_validate cookbook recommendation"

authority:
  summary: >-
    Current-era OpenWrt init scripts should validate typed config through uci_load_validate inside a procd-oriented init script rather than parsing /etc/config manually.
  primary_source:
    source_type: "upstream_code"
    path_or_url: "https://github.com/openwrt/openwrt/blob/master/package/base-files/files/etc/init.d/system"
    locator: "init-script structure and validation boundary"
  supporting_sources:
    - source_type: "frozen_test_packet"
      path_or_url: "docs/plans/v14/openwrt-cookbook-project-center/artifacts/test-pack/03-golden-answers-key.md"
      locator: "Scenario 01 and Scenario 06"
    - source_type: "repo_doc"
      path_or_url: "static/cookbook-source/procd-service-lifecycle.md"
      locator: "existing lifecycle guidance"
  why_authoritative: >-
    The upstream init-script contract plus the frozen golden key define the exact validation pattern and make the extension source-backed.

blind_prompt:
  prompt_text: |
    Write an OpenWrt init-script function snippet that validates a loglevel option from UCI as an integer before the service starts.
  prompt_notes:
    - "Do not mention uci_load_validate explicitly."
    - "Keep the task inside init-script validation, not full daemon startup or respawn behavior."
    - "Make the task OpenWrt-specific enough that grep or regex parsing can fail."

scoring:
  expected_paradigms:
    - "USE_PROCD=1 or clear procd init-script context"
    - "uci_load_validate"
    - "typed integer validation"
    - "init-script-local validation helper or start_service context"
  explicit_falsenesses:
    - "grep or awk parsing of /etc/config"
    - "manual regex validation in shell"
    - "generic Linux service config parsing divorced from UCI"
  binary_pass_rule: "all required paradigms present and no falseness triggered"

family_assignment:
  family_id: "FAM-INIT-PROCD"
  family_decision:
    existing_family_match: true
    reason: "This packet isolates the specific still-open validation lesson inside the procd family."

coverage_check:
