    - "static/cookbook-source/procd-service-lifecycle.md"
  already_adequately_covered: false
  coverage_rationale: >-
    The current page teaches the lifecycle boundary but does not yet provide the complete focused uci_load_validate treatment that the gap map calls out.
  preferred_outcome_if_fail:
    allowed_values:
      - reject
      - golden-key-only
      - extend-existing-page
      - new-standalone-page
      - umbrella-page
    value: "extend-existing-page"
  target_pages:
    - "static/cookbook-source/procd-service-lifecycle.md"

