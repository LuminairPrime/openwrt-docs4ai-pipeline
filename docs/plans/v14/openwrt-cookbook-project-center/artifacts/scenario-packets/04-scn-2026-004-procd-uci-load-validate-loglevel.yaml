    The existing procd family is already covered, but both prior scenarios and cross-batch synthesis indicate that a full uci_load_validate treatment is still under-surfaced and should be made explicit.
  primary_source:
    source_type: "repo_doc"
    path_or_url: "docs/plans/v14/openwrt-cookbook-project-center/01-current-cookbook-state-and-gap-map.md"
