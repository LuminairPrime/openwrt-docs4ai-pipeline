# mise.toml — unified task-runner interface for openwrt-docs4ai
#
# Provides a single-entry command for local QA validation that mirrors
# the GitHub Actions CI environment inside an ephemeral testcontainers
# Linux container.
#
# Usage:
#   mise run qa               # full pipeline
#   mise run qa-smoke          # post-extract validation only (no extractors)
#   mise run qa-lint            # source validation (ruff + pyright + actionlint)
#   mise run qa -- --help       # forward args to the orchestrator

[tools]
python = "3.12"

[env]
CI = "true"
PIPELINE_RUN_DIR = "tmp/pipeline-ci"
OUTDIR = "tmp/pipeline-ci/staged"
STAGED_DIR = "tmp/pipeline-ci/staged"
WORKDIR = "tmp/pipeline-ci/downloads"
PROCESSED_DIR = "tmp/pipeline-ci/processed"
DIST_PAGES_REPO = "openwrt-docs4ai/openwrt-docs4ai.github.io"
DIST_RELEASE_REPO = "openwrt-docs4ai/corpus"
DIST_TARGET_BRANCH = "main"
DIST_ZIP_ROOT_DIR = "openwrt-docs4ai"

[tasks.qa]
description = "Run full QA pipeline in ephemeral Testcontainers CI environment"
run = "python tests/qa_pipeline_orchestrator.py"

[tasks.qa-smoke]
description = "Run smoke-only QA (post-extract validation, no extractors)"
run = "python tests/qa_pipeline_orchestrator.py --smoke"

[tasks.qa-lint]
description = "Run source validation (ruff + pyright + actionlint)"
run = "python tests/check_linting.py --strict"
